name: Deploy

# Každá zmena na master — priamy push aj merge PR (merge je tiež push na master).
on:
  push:
    branches: [master]
  workflow_dispatch:

# Nasadenie sa nikdy neruší uprostred (migrácie); ďalší push počká.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Nasadenie na produkciu
    runs-on: ubuntu-latest
    env:
      # Websupport mení SSH port pri zapnutí konzoly — prepíše sa premennou
      # repozitára SSH_PORT, bez úpravy workflowu.
      SSH_PORT: ${{ vars.SSH_PORT || '27922' }}

    steps:
      - uses: actions/checkout@v4

      - name: Nastav Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Nainštaluj závislosti
        run: npm ci

      # Na serveri sa nebuilduje — nie je tam dosť pamäte.
      - name: Build
        run: npm run build

      - name: Priprav SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "[shell.r2.websupport.sk]:${SSH_PORT} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILvofctnNpmcfXIs7+ErytcD19+EG3Hfy6ss4TRueUfD" >> ~/.ssh/known_hosts

      # Vedľa živého buildu; prehodí ho až deploy.sh po git pull.
      - name: Nahraj build na server
        run: |
          tar -C public/build -czf - . | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" uid1079389@shell.r2.websupport.sk \
            'rm -rf ~/hlascirkvi.sk/web/public/build.new && mkdir -p ~/hlascirkvi.sk/web/public/build.new && tar -xzf - -C ~/hlascirkvi.sk/web/public/build.new'

      # Pull pred skriptom, aby sa vždy spustila jeho aktuálna verzia z master.
      - name: Spusti deploy skript na serveri
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" uid1079389@shell.r2.websupport.sk \
            'cd ~/hlascirkvi.sk/web && git pull --ff-only origin master && bash deploy/deploy.sh'
